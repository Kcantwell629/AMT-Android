org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# compileSdk 36 may be newer than this AGP version was tested against; the SDK
# installed on this machine only has platforms 36/37 available, so suppress
# the compile-sdk-too-new warning rather than pin to an uninstalled platform.
android.suppressUnsupportedCompileSdk=36
